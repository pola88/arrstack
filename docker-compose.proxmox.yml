services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Argentina/Buenos_Aires
      - WEBUI_PORT=8080
    volumes:
      - /data/docker/qbittorrent:/config
      - /data:/data
    ports:
      - 8080:8080
      - 6881:6881
      - 6881:6881/udp
    networks:
      - arrstack_net
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Argentina/Buenos_Aires
    volumes:
      - /data/docker/prowlarr:/config
    ports:
      - 9696:9696
    networks:
      - arrstack_net
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    depends_on:
      - qbittorrent
      - prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Argentina/Buenos_Aires
    volumes:
      - /data/docker/sonarr:/config
      - /data:/data
    ports:
      - 8989:8989
    networks:
      - arrstack_net
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    depends_on:
      - qbittorrent
      - prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Argentina/Buenos_Aires
    volumes:
      - /data/docker/radarr:/config
      - /data:/data
    ports:
      - 7878:7878
    networks:
      - arrstack_net
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    depends_on:
      - sonarr
      - radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Argentina/Buenos_Aires
    volumes:
      - /data/docker/bazarr:/config
      - /data:/data
    ports:
      - 6767:6767
    networks:
      - arrstack_net
    restart: unless-stopped

  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    network_mode: host
    devices:
      - /dev/dri:/dev/dri
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Argentina/Buenos_Aires
      - VERSION=docker
    volumes:
      - /data/docker/plex:/config
      - /data/media:/media
      - /tmp/plex-transcode:/transcode
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=America/Argentina/Buenos_Aires
    ports:
      - 8191:8191
    networks:
      - arrstack_net
    restart: unless-stopped

  mediabot:
    build:
      context: ./mediabot
      dockerfile: Dockerfile
    container_name: mediabot
    restart: unless-stopped
    ports:
      - "8222:8222"
    volumes:
      - /data:/data:ro
      - mediabot_db:/app/data
    # Compose reads project .env for ${...} substitution (no env_file in container).
    environment:
      WEBHOOK_HOST: "0.0.0.0"
      WEBHOOK_PORT: "8222"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_ALLOWED_USERS: ${TELEGRAM_ALLOWED_USERS}
      RADARR_URL: ${RADARR_URL:-http://radarr:7878}
      RADARR_API_KEY: ${RADARR_API_KEY:-}
      SONARR_URL: ${SONARR_URL:-http://sonarr:8989}
      SONARR_API_KEY: ${SONARR_API_KEY:-}
      PROWLARR_URL: ${PROWLARR_URL:-http://prowlarr:9696}
      PROWLARR_API_KEY: ${PROWLARR_API_KEY:-}
      BAZARR_URL: ${BAZARR_URL:-http://bazarr:6767}
      BAZARR_API_KEY: ${BAZARR_API_KEY:-}
      QBIT_URL: ${QBIT_URL:-http://qbittorrent:8080}
      QBIT_USER: ${QBIT_USER:-admin}
      QBIT_PASS: ${QBIT_PASS:-}
      PLEX_URL: ${PLEX_URL:-http://plex:32400}
      PLEX_TOKEN: ${PLEX_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DISK_WARN_THRESHOLD_GB: ${DISK_WARN_THRESHOLD_GB:-50}
      DATA_PATH: ${DATA_PATH:-/data}
      DB_PATH: ${DB_PATH:-/app/data/mediabot.db}
      STACK_ID_ARR: ${STACK_ID_ARR}
      STACK_ID_MONITORING: ${STACK_ID_MONITORING}
      ENDPOINT_ID: ${ENDPOINT_ID}
      PORTAINER_URL: ${PORTAINER_URL}
      PORTAINER_API_TOKEN: ${PORTAINER_API_TOKEN}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8222/health')",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - arrstack_net

volumes:
  mediabot_db:

networks:
  arrstack_net:
    name: arrstack_net

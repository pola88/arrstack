services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - TZ=America/Argentina/Buenos_Aires
      - WEBUI_PORT=8080
    volumes:
      - /data/docker/qbittorrent:/config
      - /data:/data
    ports:
      - 8080:8080
      - 6881:6881
      - 6881:6881/udp
    networks:
      - arrstack_net
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - TZ=America/Argentina/Buenos_Aires
    volumes:
      - /data/docker/prowlarr:/config
    ports:
      - 9696:9696
    networks:
      - arrstack_net
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    depends_on:
      - qbittorrent
      - prowlarr
    environment:
      - TZ=America/Argentina/Buenos_Aires
    volumes:
      - /data/docker/sonarr:/config
      - /data:/data
    ports:
      - 8989:8989
    networks:
      - arrstack_net
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    depends_on:
      - qbittorrent
      - prowlarr
    environment:
      - TZ=America/Argentina/Buenos_Aires
    volumes:
      - /data/docker/radarr:/config
      - /data:/data
    ports:
      - 7878:7878
    networks:
      - arrstack_net
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    depends_on:
      - sonarr
      - radarr
    environment:
      - TZ=America/Argentina/Buenos_Aires
    volumes:
      - /data/docker/bazarr:/config
      - /data:/data
    ports:
      - 6767:6767
    networks:
      - arrstack_net
    restart: unless-stopped

  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    network_mode: host
    environment:
      - TZ=America/Argentina/Buenos_Aires
      - VERSION=docker
    volumes:
      - /data/docker/plex:/config
      - /data/media:/media
      - /tmp/plex-transcode:/transcode
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=America/Argentina/Buenos_Aires
    ports:
      - 8191:8191
    networks:
      - arrstack_net
    restart: unless-stopped

  mediabot:
    build:
      context: ./mediabot
      dockerfile: Dockerfile
    container_name: mediabot
    restart: unless-stopped
    ports:
      - "8222:8222"
    volumes:
      - /data:/data:ro
      - mediabot_db:/app/data
    env_file:
      - ./.env
    environment:
      - WEBHOOK_HOST=0.0.0.0
      - WEBHOOK_PORT=8222
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8222/health')",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - arrstack_net

volumes:
  mediabot_db:

networks:
  arrstack_net:
    name: arrstack_net
